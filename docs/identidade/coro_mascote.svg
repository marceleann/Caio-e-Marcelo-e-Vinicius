<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <!-- CORO mascote: robo ouvinte, cabeca inclinada, fones; as vozes chegam da esquerda. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123540"/>
      <stop offset="1" stop-color="#0C242C"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="464" height="464" rx="48" fill="url(#bg)"/>

  <!-- vozes chegando (tres alinhadas, uma desafinando) -->
  <g fill="none" stroke-linecap="round">
    <path d="M 36 180 C 56 170, 76 190, 96 180 S 136 170, 168 178" stroke="#CFE3E8" stroke-width="5.5" opacity="0.9"/>
    <path d="M 36 200 C 56 190, 76 210, 96 200 S 136 192, 168 198" stroke="#8FB4BD" stroke-width="5.5" opacity="0.9"/>
    <path d="M 36 220 C 56 210, 76 230, 96 220 S 136 214, 168 218" stroke="#5E8A96" stroke-width="5.5" opacity="0.9"/>
    <path d="M 36 240 C 58 232, 78 252, 100 250 S 140 272, 166 288" stroke="#FF7A1A" stroke-width="7"/>
  </g>

  <!-- sombra -->
  <ellipse cx="300" cy="416" rx="120" ry="16" fill="#000000" opacity="0.25"/>

  <!-- corpo -->
  <g>
    <rect x="240" y="286" width="120" height="112" rx="26" fill="#1C4652"/>
    <!-- visor com equalizador: uma barra fora do tom -->
    <rect x="258" y="306" width="84" height="52" rx="10" fill="#0F2E36"/>
    <g stroke-linecap="round">
      <line x1="272" y1="346" x2="272" y2="330" stroke="#8FB4BD" stroke-width="7"/>
      <line x1="288" y1="346" x2="288" y2="326" stroke="#8FB4BD" stroke-width="7"/>
      <line x1="304" y1="346" x2="304" y2="314" stroke="#FF7A1A" stroke-width="7"/>
      <line x1="320" y1="346" x2="320" y2="328" stroke="#8FB4BD" stroke-width="7"/>
    </g>
    <!-- bracos -->
    <rect x="222" y="300" width="16" height="58" rx="8" fill="#16404C"/>
    <rect x="362" y="300" width="16" height="58" rx="8" fill="#16404C"/>
  </g>

  <!-- cabeca inclinada (escutando) -->
  <g transform="rotate(-8 300 205)">
    <!-- antena -->
    <line x1="300" y1="118" x2="300" y2="140" stroke="#16404C" stroke-width="8" stroke-linecap="round"/>
    <circle cx="300" cy="110" r="10" fill="#FF7A1A"/>

    <!-- cabeca -->
    <rect x="228" y="140" width="144" height="126" rx="30" fill="#1C4652"/>
    <rect x="244" y="158" width="112" height="90" rx="20" fill="#0F2E36"/>

    <!-- olhos: um atento, um cerrado (avaliando) -->
    <circle cx="278" cy="200" r="13" fill="#F5EFE8"/>
    <circle cx="281" cy="200" r="6" fill="#0F2E36"/>
    <path d="M 312 200 q 12 -10 24 0" fill="none" stroke="#F5EFE8" stroke-width="6" stroke-linecap="round"/>

    <!-- fones de ouvido -->
    <path d="M 226 168 A 76 76 0 0 1 374 168" fill="none" stroke="#FF7A1A" stroke-width="11" stroke-linecap="round"/>
    <rect x="206" y="168" width="26" height="52" rx="12" fill="#FF7A1A"/>
    <rect x="368" y="168" width="26" height="52" rx="12" fill="#FF7A1A"/>
  </g>

  <!-- nome -->
  <text x="240" y="452" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="30" font-weight="650" letter-spacing="8" fill="#F5EFE8">CORO</text>
</svg>
